name: 'snowflake_analytics'
version: '1.0.0'


profile: 'snowflake_analytics'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

models:
  snowflake_analytics:

    staging:
      +schema: stg
      +materialized: view
      +tags: ['staging']

    intermediate:
      +schema: int
      +materialized: view
      +tags: ['intermediate']

    marts:
      +schema: marts
      +materialized: incremental
      +tags: ['marts']